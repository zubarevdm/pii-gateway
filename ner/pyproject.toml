[project]
name = "ru-pii-ner"
version = "0.1.0"
description = "Russian PII detection: dataset, baselines and a fine-tuned NER model"
requires-python = ">=3.11"
dependencies = [
    "natasha>=1.6",
    "nervaluate>=0.2",
    "pydantic>=2",
    "faker>=30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
